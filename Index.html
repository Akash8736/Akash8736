!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ChatGPT Web App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background: #f4f4f9; }
        #chat-box { height: 350px; border: 1px solid #ccc; background: #fff; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .user { text-align: right; color: blue; margin: 5px 0; }
        .bot { text-align: left; color: green; margin: 5px 0; }
        input[type="text"], input[type="password"] { width: 70%; padding: 10px; margin-bottom: 10px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>🤖 My ChatGPT AI Assistant</h2>
    
    <input type="password" id="apiKey" placeholder="Apni OpenAI API Key Yahan Daalein">
    
    <div id="chat-box"></div>

    <input type="text" id="userInput" placeholder="Kuch bhi pūchein...">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value;
            const userInput = document.getElementById('userInput').value;
            const chatBox = document.getElementById('chat-box');

            if (!apiKey) {
                alert("Kripya pehle OpenAI API Key daalein!");
                return;
            }
            if (!userInput) return;

            // User Message Display
            chatBox.innerHTML += `<div class="user"><b>You:</b> ${userInput}</div>`;
            document.getElementById('userInput').value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // OpenAI API Request
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [{ role: "user", content: userInput }]
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    const botReply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="bot"><b>ChatGPT:</b> ${botReply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="bot" style="color:red;"><b>Error:</b> Invalid API Key ya Issue!</div>`;
                }
            } catch (error) {
                chatBox.innerHTML += `<div class="bot" style="color:red;"><b>Error:</b> Connection failed!</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
  </html>
